[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-probe-analysis"
version = "0.1.0"
description = "Pump-probe spectroscopy analysis (PPS), optional Qt GUI, and helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "scikit-image",
  "scipy",
  "tifffile",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6.0"]

[project.scripts]
pump-probe-gui = "pump_probe_analysis.puprisa_gui:main"

[tool.setuptools.packages.find]
where = ["src"]
